name: Release sricap-rec macOS

on:
  push:
    branches:
      - feature1
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.6.6)"
        required: false
        default: "v0.6.6"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_BUILD_JOBS: "4"
  ACTIONS_RUNNER_FORCE_ENV_WARNINGS: "false"

jobs:
  build-macos-arm64:
    name: Build & Package sricap-rec (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (ffmpeg, pnpm, cargo-tauri)
        run: |
          brew install ffmpeg@7 pkg-config cmake ninja
          echo "$(brew --prefix ffmpeg@7)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> $GITHUB_ENV
          npm install -g pnpm@10.15.0 @tauri-apps/cli@2.9.6

      - name: Install Rust toolchains (1.88.0 + 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-apple-darwin
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin

      - name: Restore Prebuilt Sidecar Binaries Cache (cap-muxer & cap-cli)
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/binaries/cap-muxer-aarch64-apple-darwin
            apps/desktop/src-tauri/binaries/cap-cli-aarch64-apple-darwin
          key: sidecar-binaries-macos-arm64-${{ hashFiles('crates/cap-muxer/**', 'crates/cap-muxer-protocol/**', 'apps/cli/**', 'Cargo.lock') }}
          restore-keys: |
            sidecar-binaries-macos-arm64-

      - name: Rust & GPUI Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop-gpui -> apps/desktop-gpui/target
          cache-on-failure: true

      - name: Cache native dependencies (Spacedrive, ONNX Runtime)
        uses: actions/cache@v4
        with:
          path: |
            target/native-deps
            target/Frameworks
          key: native-deps-macos-arm64-${{ hashFiles('scripts/setup.js') }}

      - name: Install JS dependencies & Setup Native Libraries
        run: |
          bun install
          echo "RUST_TARGET_TRIPLE=aarch64-apple-darwin" >> .env
          RUST_TARGET_TRIPLE=aarch64-apple-darwin bun run cap-setup

      - name: Restore or Build Sidecar Binaries (cap-muxer & cap-cli)
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          SIDECAR_CHANGED="false"
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -E '^(crates/cap-muxer|crates/cap-muxer-protocol|apps/cli)/' >/dev/null 2>&1; then
              SIDECAR_CHANGED="true"
            fi
          fi

          if [ "$SIDECAR_CHANGED" = "false" ] && 
             [ -f "apps/desktop/src-tauri/binaries/cap-muxer-aarch64-apple-darwin" ] && 
             [ -f "apps/desktop/src-tauri/binaries/cap-cli-aarch64-apple-darwin" ]; then
            chmod +x apps/desktop/src-tauri/binaries/cap-muxer-aarch64-apple-darwin apps/desktop/src-tauri/binaries/cap-cli-aarch64-apple-darwin
            echo "Reusing cached prebuilt sidecar binaries (cap-muxer & cap-cli)"
          else
            if [ "$SIDECAR_CHANGED" = "false" ]; then
              RELEASE_SIDECARS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cap-sidecars-macos-arm64.tar.gz"
              if curl -fsSL "$RELEASE_SIDECARS_URL" -o /tmp/cap-sidecars-macos-arm64.tar.gz; then
                tar -xzf /tmp/cap-sidecars-macos-arm64.tar.gz -C apps/desktop/src-tauri/binaries
                chmod +x apps/desktop/src-tauri/binaries/cap-muxer-aarch64-apple-darwin apps/desktop/src-tauri/binaries/cap-cli-aarch64-apple-darwin
                rm -f /tmp/cap-sidecars-macos-arm64.tar.gz
                echo "Downloaded prebuilt sidecars from latest GitHub release"
              fi
            fi

            if [ ! -x "apps/desktop/src-tauri/binaries/cap-muxer-aarch64-apple-darwin" ] || 
               [ ! -x "apps/desktop/src-tauri/binaries/cap-cli-aarch64-apple-darwin" ]; then
              echo "Compiling sidecar binaries from source..."
              chmod +x scripts/build-desktop-binaries.sh
              ./scripts/build-desktop-binaries.sh aarch64-apple-darwin
            fi
          fi

      - name: Build & Bundle sricap-rec GPUI App
        run: |
          chmod +x scripts/build-gpui-binary.sh
          node scripts/bundle-gpui.mjs aarch64-apple-darwin --bundles app

      - name: Ad-hoc Sign & Package Distributable DMG + ZIP + Prebuilt Sidecars + SHA256SUMS
        run: |
          mkdir -p dist-release
          tar -czf dist-release/cap-sidecars-macos-arm64.tar.gz -C apps/desktop/src-tauri/binaries cap-muxer-aarch64-apple-darwin cap-cli-aarch64-apple-darwin

          APP_PATH="$(find apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle/macos apps/desktop/src-tauri/target/release/bundle -name "sricap-rec.app" 2>/dev/null | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Error: sricap-rec.app not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist-release/sricap-rec-macos-arm64.zip"

          DMG_STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGING/sricap-rec.app"
          ln -s /Applications "$DMG_STAGING/Applications"
          if [ -f "apps/desktop/src-tauri/icons/macos/icon.icns" ]; then
            cp "apps/desktop/src-tauri/icons/macos/icon.icns" "$DMG_STAGING/.VolumeIcon.icns"
            SetFile -c icnC "$DMG_STAGING/.VolumeIcon.icns" || true
            SetFile -a C "$DMG_STAGING" || true
          fi

          RW_DMG="$(mktemp -u).dmg"
          hdiutil create -volname "sricap-rec" -srcfolder "$DMG_STAGING" -ov -format UDRW "$RW_DMG"
          MOUNT_DIR="/Volumes/sricap-rec"
          if hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG" -mountpoint "$MOUNT_DIR"; then
            osascript <<'EOF' || true
          tell application "Finder"
            tell disk "sricap-rec"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 760, 460}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 104
              set position of item "sricap-rec.app" of container window to {150, 165}
              set position of item "Applications" of container window to {410, 165}
              close
              open
              update without registering applications
              delay 1
            end tell
          end tell
          EOF
            sync
            hdiutil detach "$MOUNT_DIR" -force || true
          fi
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -ov -o "dist-release/sricap-rec.dmg"
          rm -rf "$DMG_STAGING" "$RW_DMG"

          if [ -f "apps/desktop/src-tauri/icons/macos/icon.icns" ]; then
            sips -i "apps/desktop/src-tauri/icons/macos/icon.icns" >/dev/null 2>&1 || true
            DeRez -only icns "apps/desktop/src-tauri/icons/macos/icon.icns" > /tmp/icns.rsrc 2>/dev/null || true
            if [ -s /tmp/icns.rsrc ]; then
              Rez -append /tmp/icns.rsrc -o "dist-release/sricap-rec.dmg" 2>/dev/null || true
              SetFile -a C "dist-release/sricap-rec.dmg" 2>/dev/null || true
            fi
          fi

          cd dist-release
          shasum -a 256 sricap-rec.dmg sricap-rec-macos-arm64.zip cap-sidecars-macos-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sricap-rec-macos-arm64
          path: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-macos-arm64.zip
            dist-release/cap-sidecars-macos-arm64.tar.gz
            dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.6' }}
          name: "sricap-rec ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.6' }} (macOS Apple Silicon)"
          body: |
            ### sricap-rec macOS Release (Apple Silicon `aarch64-apple-darwin`)
            - **Direct Drag-and-Drop Installer**: Download `sricap-rec.dmg`, open it, and drag `sricap-rec.app` to `/Applications`.
            - **Auto-Update Bundle**: `sricap-rec-macos-arm64.zip` (used by in-app **Check for Updates**).
            - **Prebuilt Sidecars**: `cap-sidecars-macos-arm64.tar.gz` (`cap-muxer` & `cap-cli` cached for fast CI).
            - **First Launch Note (Ad-hoc Signed)**: If macOS Gatekeeper prompts on first launch, run:
              ```bash
              xattr -cr /Applications/sricap-rec.app
              ```
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-macos-arm64.zip
            dist-release/cap-sidecars-macos-arm64.tar.gz
            dist-release/SHA256SUMS.txt
