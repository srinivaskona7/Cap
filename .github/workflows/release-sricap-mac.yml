name: Release sricap-rec macOS

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - feature1
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.6.1)"
        required: false
        default: "v0.6.1"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Release sricap-rec (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Rust Toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add aarch64-apple-darwin --toolchain 1.95.0

      - name: Cache native dependencies (FFmpeg, ONNX Runtime, Spacedrive)
        uses: actions/cache@v4
        with:
          path: |
            target/native-deps
            target/ffmpeg
          key: native-deps-macos-arm64-${{ hashFiles('scripts/setup.js') }}

      - name: Cache Rust workspaces
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop-gpui -> apps/desktop-gpui/target

      - name: Install dependencies & native libraries
        run: |
          bun install
          bun run cap-setup

      - name: Build sricap-rec macOS App & DMG
        run: |
          bun run gpui:build aarch64-apple-darwin

      - name: Package release artifacts & SHA256 checksums
        run: |
          mkdir -p dist-release
          BUNDLE_DIR="apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle"
          DMG_FILE="$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -n 1)"
          cp "$DMG_FILE" dist-release/sricap-rec-arm64.dmg
          cp "$DMG_FILE" dist-release/sricap-rec.dmg
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE_DIR/macos/sricap-rec.app" dist-release/sricap-rec-arm64.zip
          cd dist-release
          shasum -a 256 sricap-rec.dmg sricap-rec-arm64.dmg sricap-rec-arm64.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.1' }}
          files: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-arm64.dmg
            dist-release/sricap-rec-arm64.zip
            dist-release/SHA256SUMS.txt
          generate_release_notes: true
