name: Release sricap-rec macOS

on:
  push:
    branches:
      - feature1
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.6.5)"
        required: false
        default: "v0.6.5"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-macos:
    name: Build & Release sricap-rec (macOS Apple Silicon)
    runs-on: macos-14
    env:
      RUST_TARGET_TRIPLE: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "12.3"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sccache for fast Rust compilation
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Rust Toolchains (Workspace 1.88.0 + GPUI 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal -c rustfmt,clippy -t aarch64-apple-darwin
          rustup toolchain install 1.95.0 --profile minimal -t aarch64-apple-darwin

      - name: Cache native dependencies (FFmpeg, ONNX Runtime, Spacedrive)
        uses: actions/cache@v4
        with:
          path: |
            target/native-deps
            target/ffmpeg
          key: native-deps-macos-arm64-${{ hashFiles('scripts/setup.js') }}

      - name: Cache Rust workspaces
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "sricap-rec-cache"
          workspaces: |
            . -> target
            apps/desktop-gpui -> apps/desktop-gpui/target

      - name: Install dependencies & native libraries
        run: |
          bun install
          echo "RUST_TARGET_TRIPLE=aarch64-apple-darwin" >> .env
          RUST_TARGET_TRIPLE=aarch64-apple-darwin bun run cap-setup

      - name: Build sidecars (cap-muxer & cap-cli) and GPUI binary in parallel
        run: |
          ./scripts/build-desktop-binaries.sh aarch64-apple-darwin &
          SIDECAR_PID=$!
          bash scripts/build-gpui-binary.sh release aarch64-apple-darwin &
          GPUI_PID=$!
          wait $SIDECAR_PID
          wait $GPUI_PID

      - name: Bundle sricap-rec macOS App (--skip-build --bundles app)
        env:
          CI: "false"
        run: |
          node scripts/bundle-gpui.mjs aarch64-apple-darwin --skip-build --bundles app

      - name: Ad-hoc Deep Codesign App Bundle
        run: |
          APP_PATH="$(find apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle/macos apps/desktop/src-tauri/target/release/bundle -name "sricap-rec.app" 2>/dev/null | head -n 1)"
          if [ -d "$APP_PATH" ]; then
            echo "Signing $APP_PATH with deep ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" || true
          fi

      - name: Package Polished macOS DMG & Auto-Updater ZIP + SHA256SUMS
        run: |
          mkdir -p dist-release
          APP_PATH="$(find apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle/macos apps/desktop/src-tauri/target/release/bundle -name "sricap-rec.app" 2>/dev/null | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No sricap-rec.app found after bundling!"
            exit 1
          fi
          echo "Found APP: $APP_PATH"

          DMG_DIR="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          if [ -f "apps/desktop/src-tauri/icons/macos/icon.icns" ]; then
            cp "apps/desktop/src-tauri/icons/macos/icon.icns" "$DMG_DIR/.VolumeIcon.icns"
            SetFile -c icnC "$DMG_DIR/.VolumeIcon.icns" 2>/dev/null || true
            SetFile -a C "$DMG_DIR" 2>/dev/null || true
          fi

          RW_DMG="$(mktemp -u).dmg"
          hdiutil create -volname "sricap-rec" -srcfolder "$DMG_DIR" -ov -format UDRW "$RW_DMG"
          MOUNT_DIR="/Volumes/sricap-rec"
          if hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG"; then
            osascript <<'EOF' || true
          tell application "Finder"
            tell disk "sricap-rec"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 800, 520}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 128
              set position of item "sricap-rec.app" of container window to {175, 190}
              set position of item "Applications" of container window to {425, 190}
              close
              open
              update without registering applications
              delay 1
            end tell
          end tell
          EOF
            sync
            hdiutil detach "$MOUNT_DIR" -force || true
          fi
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -ov -o dist-release/sricap-rec.dmg
          rm -f "$RW_DMG"
          rm -rf "$DMG_DIR"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist-release/sricap-rec-macos-arm64.zip
          cd dist-release
          shasum -a 256 sricap-rec.dmg sricap-rec-macos-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sricap-rec-macos-arm64
          compression-level: 9
          path: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-macos-arm64.zip
            dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.5' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-macos-arm64.zip
            dist-release/SHA256SUMS.txt
