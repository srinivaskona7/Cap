name: Release sricap-rec macOS

on:
  push:
    branches:
      - feature1
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.6.1)"
        required: false
        default: "v0.6.1"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Release sricap-rec (macOS Apple Silicon)
    runs-on: macos-14
    env:
      RUST_TARGET_TRIPLE: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "12.3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Rust Toolchains (Workspace 1.88.0 + GPUI 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal -c rustfmt,clippy -t aarch64-apple-darwin
          rustup toolchain install 1.95.0 --profile minimal -t aarch64-apple-darwin

      - name: Cache native dependencies (FFmpeg, ONNX Runtime, Spacedrive)
        uses: actions/cache@v4
        with:
          path: |
            target/native-deps
            target/ffmpeg
          key: native-deps-macos-arm64-${{ hashFiles('scripts/setup.js') }}

      - name: Cache Rust workspaces
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop-gpui -> apps/desktop-gpui/target

      - name: Install dependencies & native libraries
        run: |
          bun install
          echo "RUST_TARGET_TRIPLE=aarch64-apple-darwin" >> .env
          RUST_TARGET_TRIPLE=aarch64-apple-darwin bun run cap-setup

      - name: Build sidecar binaries (cap-muxer & cap-cli)
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          ./scripts/build-desktop-binaries.sh aarch64-apple-darwin

      - name: Build & Bundle sricap-rec macOS App & DMG
        env:
          CI: "false"
        run: |
          node scripts/bundle-gpui.mjs aarch64-apple-darwin --bundles app,dmg

      - name: Package release artifacts & SHA256 checksums
        run: |
          mkdir -p dist-release
          DMG_FILE="$(find apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle/dmg apps/desktop/src-tauri/target/release/bundle -name "*.dmg" 2>/dev/null | head -n 1)"
          APP_PATH="$(find apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle/macos apps/desktop/src-tauri/target/release/bundle -name "sricap-rec.app" 2>/dev/null | head -n 1)"
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "::error::No .dmg found after bundling!"
            exit 1
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No sricap-rec.app found after bundling!"
            exit 1
          fi
          echo "Found DMG: $DMG_FILE"
          echo "Found APP: $APP_PATH"
          cp "$DMG_FILE" dist-release/sricap-rec.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist-release/sricap-rec-macos-arm64.zip
          cd dist-release
          shasum -a 256 sricap-rec.dmg sricap-rec-macos-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sricap-rec-macos-arm64
          compression-level: 9
          path: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-macos-arm64.zip
            dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.1' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/sricap-rec.dmg
            dist-release/sricap-rec-macos-arm64.zip
            dist-release/SHA256SUMS.txt
