name: Release sricap-rec (macOS & Windows)

on:
  push:
    branches:
      - feature1
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.6.7)"
        required: false
        default: "v0.6.7"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build sricap-rec (macOS ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            name: Silicon
            artifact_dmg: mac-silicon.dmg
            artifact_zip: mac-silicon.zip
          - target: x86_64-apple-darwin
            runner: macos-14
            name: Intel
            artifact_dmg: mac-intel.dmg
            artifact_zip: mac-intel.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (ffmpeg, pnpm, cargo-tauri)
        run: |
          brew install ffmpeg@7 pkg-config cmake ninja
          echo "$(brew --prefix ffmpeg@7)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> $GITHUB_ENV
          npm install -g pnpm@10.15.0 @tauri-apps/cli@2.9.6

      - name: Install Rust toolchains (1.88.0 + 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}
          rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
          rustup default 1.88.0

      - name: Install Dependencies
        run: bun install

      - name: Run cap-setup
        run: |
          echo "RUST_TARGET_TRIPLE=${{ matrix.target }}" >> .env
          bun run cap-setup
          mkdir -p apps/desktop-gpui/.cargo
          cp .cargo/config.toml apps/desktop-gpui/.cargo/config.toml 2>/dev/null || true
          mkdir -p apps/desktop-gpui/target/${{ matrix.target }}/release/Frameworks
          mkdir -p apps/desktop-gpui/target/Frameworks
          if [ -d "target/Frameworks/Spacedrive.framework" ]; then
            cp -R target/Frameworks/Spacedrive.framework apps/desktop-gpui/target/${{ matrix.target }}/release/Frameworks/
            cp -R target/Frameworks/Spacedrive.framework apps/desktop-gpui/target/Frameworks/
          fi
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Prepare GPUI Dependency
        run: |
          node scripts/sync-desktop-versions.mjs
          chmod +x scripts/prepare-gpui-dependency.sh
          ./scripts/prepare-gpui-dependency.sh

      - name: Build Sidecar Binaries
        run: |
          chmod +x scripts/build-desktop-binaries.sh
          ./scripts/build-desktop-binaries.sh ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Build & Bundle sricap-rec GPUI App
        run: |
          chmod +x scripts/build-gpui-binary.sh
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            node scripts/bundle-gpui.mjs ${{ matrix.target }} --bundles app || ./scripts/build-gpui-binary.sh release ${{ matrix.target }}
          else
            ./scripts/build-gpui-binary.sh release ${{ matrix.target }} || {
              echo "Direct Cargo build fallback..."
              cd apps/desktop-gpui
              cargo +1.95.0 build --release --target ${{ matrix.target }}
              cd ../..
              mkdir -p apps/desktop/src-tauri/binaries
              cp apps/desktop-gpui/target/${{ matrix.target }}/release/sricap-rec apps/desktop/src-tauri/binaries/sricap-rec-${{ matrix.target }} || true
            }
          fi

      - name: Package macOS DMG & ZIP
        run: |
          mkdir -p dist-release
          APP_PATH="$(find apps/desktop-gpui/target/${{ matrix.target }}/release/bundle/macos apps/desktop/src-tauri/target/release/bundle -name "sricap-rec.app" 2>/dev/null | head -n 1)"
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Creating clean macOS .app bundle structure from built binary..."
            STAGING_APP="dist-release/sricap-rec.app"
            mkdir -p "$STAGING_APP/Contents/MacOS"
            mkdir -p "$STAGING_APP/Contents/Resources"
            BIN_PATH="apps/desktop/src-tauri/binaries/sricap-rec-${{ matrix.target }}"
            if [ ! -f "$BIN_PATH" ]; then
              BIN_PATH="apps/desktop-gpui/target/${{ matrix.target }}/release/sricap-rec"
            fi
            cp "$BIN_PATH" "$STAGING_APP/Contents/MacOS/sricap-rec"
            chmod +x "$STAGING_APP/Contents/MacOS/sricap-rec"
            cp apps/desktop-gpui/Info.plist "$STAGING_APP/Contents/Info.plist" 2>/dev/null || true
            APP_PATH="$STAGING_APP"
          fi

          echo "Found app bundle at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist-release/${{ matrix.artifact_zip }}"

          DMG_STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGING/sricap-rec.app"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "sricap-rec" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist-release/${{ matrix.artifact_dmg }}"
          rm -rf "$DMG_STAGING"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-artifacts
          overwrite: true
          path: dist-release/*

  build-windows:
    name: Build sricap-rec (Windows x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain (1.88.0 + 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.88.0

      - name: Install Dependencies
        run: bun install

      - name: Increase pagefile size for Windows Rust link
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Create root .env for Windows target
        shell: bash
        run: |
          echo "RUST_TARGET_TRIPLE=x86_64-pc-windows-msvc" >> .env

      - name: Run cap-setup
        shell: bash
        run: |
          bun run cap-setup
          mkdir -p apps/desktop-gpui/.cargo
          cp .cargo/config.toml apps/desktop-gpui/.cargo/config.toml 2>/dev/null || true
          mkdir -p apps/desktop-gpui/target/native-deps
          cp -r target/native-deps/* apps/desktop-gpui/target/native-deps/ 2>/dev/null || true
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

      - name: Prepare GPUI Dependency (Windows)
        shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh

      - name: Build Sidecar Binaries (Windows)
        shell: bash
        run: |
          node scripts/build-desktop-binaries.mjs x86_64-pc-windows-msvc
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Build sricap-rec for Windows
        shell: bash
        run: |
          ./scripts/build-gpui-binary.sh release x86_64-pc-windows-msvc || {
            echo "Falling back to node scripts/bundle-gpui.mjs or direct cargo..."
            node scripts/bundle-gpui.mjs x86_64-pc-windows-msvc --no-bundle || {
              cd apps/desktop-gpui
              cargo +1.95.0 build --release --target x86_64-pc-windows-msvc
              cd ../..
              mkdir -p apps/desktop/src-tauri/binaries
              cp apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/sricap-rec.exe apps/desktop/src-tauri/binaries/sricap-rec-x86_64-pc-windows-msvc.exe || true
            }
          }
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Bundle Windows Installer (windows.exe)
        shell: bash
        run: |
          mkdir -p dist-windows
          npm install -g @tauri-apps/cli@2.9.6
          node scripts/bundle-gpui.mjs x86_64-pc-windows-msvc --skip-build --bundles nsis || true
          
          # Check for NSIS installer or copy standalone binary
          if ls apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe 1> /dev/null 2>&1; then
            cp apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist-windows/windows.exe
          elif [ -f apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/sricap-rec.exe ]; then
            cp apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/sricap-rec.exe dist-windows/windows.exe
          elif [ -f apps/desktop/src-tauri/binaries/sricap-rec-x86_64-pc-windows-msvc.exe ]; then
            cp apps/desktop/src-tauri/binaries/sricap-rec-x86_64-pc-windows-msvc.exe dist-windows/windows.exe
          elif [ -f apps/desktop-gpui/target/release/sricap-rec.exe ]; then
            cp apps/desktop-gpui/target/release/sricap-rec.exe dist-windows/windows.exe
          fi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          overwrite: true
          path: dist-windows/*

  publish:
    name: Publish Multi-Platform Release (macOS & Windows)
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Collect & Organize Clean Release Assets
        run: |
          mkdir -p release-assets
          find raw-artifacts -name "mac-silicon.dmg" -exec cp {} release-assets/ \;
          find raw-artifacts -name "mac-intel.dmg" -exec cp {} release-assets/ \;
          find raw-artifacts -name "windows.exe" -exec cp {} release-assets/ \;
          
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }}
          name: "sricap-rec ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }}"
          body: |
            ### 🚀 sricap-rec Multi-Platform Release
            
            Simplified downloads for all platforms:
            - 🍏 **Apple Silicon Mac**: [`mac-silicon.dmg`](https://github.com/srinivaskona7/Cap/releases/download/${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }}/mac-silicon.dmg) (M1, M2, M3, M4)
            - 🍏 **Intel Mac**: [`mac-intel.dmg`](https://github.com/srinivaskona7/Cap/releases/download/${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }}/mac-intel.dmg) (x86_64 Intel Macs)
            - 🪟 **Windows**: [`windows.exe`](https://github.com/srinivaskona7/Cap/releases/download/${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }}/windows.exe) (Windows 10/11 64-bit Installer)

            ---
            **Included Novelty Features:**
            - ⚡ **Live Internet Speedometer**: Real-time traffic, latency, jitter & bufferbloat telemetry.
            - 🎬 **Studio Pro Video Player**: PIP, speed control, 0.5x–2.0x, subtitle support, and loop mode.
            - 📖 **Universal Reader**: Dual-pane reader for PDFs, EPUBs, Markdown notes, and manuals.
            - 📱 **Mobile Screen Mirroring**: Low-latency wireless & USB Android mirroring.
            - 🤖 **AI Interview Copilot**: 100% stealth prompter with system audio transcription and auto-summarizer.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
