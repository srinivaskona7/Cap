name: Release sricap-rec (macOS & Windows)

on:
  push:
    branches:
      - feature1
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.6.7)"
        required: false
        default: "v0.6.7"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build sricap-rec (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (ffmpeg, pnpm, cargo-tauri)
        run: |
          brew install ffmpeg@7 pkg-config cmake ninja
          echo "$(brew --prefix ffmpeg@7)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg@7)" >> $GITHUB_ENV
          npm install -g pnpm@10.15.0 @tauri-apps/cli@2.9.6

      - name: Install Rust toolchains (1.88.0 + 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-apple-darwin
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.88.0

      - name: Install Dependencies
        run: bun install

      - name: Run cap-setup
        run: bun run cap-setup
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin

      - name: Build Sidecar Binaries
        run: |
          chmod +x scripts/build-desktop-binaries.sh
          ./scripts/build-desktop-binaries.sh aarch64-apple-darwin
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Build & Bundle sricap-rec GPUI App
        run: |
          chmod +x scripts/build-gpui-binary.sh
          node scripts/bundle-gpui.mjs aarch64-apple-darwin --bundles app

      - name: Package macOS DMG & ZIP
        run: |
          mkdir -p dist-release
          APP_PATH="$(find apps/desktop-gpui/target/aarch64-apple-darwin/release/bundle/macos apps/desktop/src-tauri/target/release/bundle -name "sricap-rec.app" 2>/dev/null | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Error: sricap-rec.app not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist-release/sricap-rec-macos-arm64.zip"

          DMG_STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGING/sricap-rec.app"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "sricap-rec" -srcfolder "$DMG_STAGING" -ov -format UDZO "dist-release/sricap-rec.dmg"
          rm -rf "$DMG_STAGING"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist-release/*

  build-windows:
    name: Build sricap-rec (Windows x64 NSIS)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchains (1.88.0 + 1.95.0)
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.88.0

      - name: Install Dependencies
        run: bun install

      - name: Increase pagefile size for Windows Rust link
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Create root .env for Windows target
        shell: bash
        run: |
          echo "RUST_TARGET_TRIPLE=x86_64-pc-windows-msvc" >> .env

      - name: Run cap-setup
        shell: bash
        run: bun run cap-setup
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

      - name: Copy native-deps to apps/desktop-gpui/target
        shell: bash
        run: |
          mkdir -p apps/desktop-gpui/.cargo
          cp .cargo/config.toml apps/desktop-gpui/.cargo/config.toml 2>/dev/null || true
          mkdir -p apps/desktop-gpui/target/native-deps
          cp -r target/native-deps/* apps/desktop-gpui/target/native-deps/ 2>/dev/null || true

      - name: Build Sidecar Binaries (Windows)
        shell: bash
        run: |
          node scripts/build-desktop-binaries.mjs x86_64-pc-windows-msvc
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Build sricap-rec for Windows
        shell: bash
        run: |
          node scripts/bundle-gpui.mjs x86_64-pc-windows-msvc --no-bundle
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - name: Bundle Windows NSIS Installer
        shell: bash
        run: |
          npm install -g @tauri-apps/cli@2.9.6
          node scripts/bundle-gpui.mjs x86_64-pc-windows-msvc --skip-build --bundles nsis
          mkdir -p dist-windows
          cp apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist-windows/sricap-rec-windows-x64-setup.exe 2>/dev/null || true
          cp apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/sricap-rec.exe dist-windows/sricap-rec-windows-x64.exe 2>/dev/null || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-windows/*

  publish:
    name: Publish Multi-Platform Release (macOS + Windows)
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }}
          name: "sricap-rec ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.6.7' }} (macOS & Windows)"
          body: |
            ### sricap-rec Unified Multi-Platform Release (macOS & Windows)
            - **macOS Apple Silicon**: `sricap-rec.dmg` (Drag-and-drop installer) & `sricap-rec-macos-arm64.zip`
            - **Windows x64**: `sricap-rec-windows-x64-setup.exe` (NSIS Installer) & `sricap-rec-windows-x64.exe` (Standalone portable)
            - **All 30 Novelty Features Included**: Live Internet Speedometer, Studio Video Player, Universal Book & Document Reader, Mobile Mirroring, 100% Stealth AI Interview Copilot, and Transcription Model Hub.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
